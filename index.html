<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JS Code Compiler</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #controls {
      padding: 10px;
      background: #eee;
      display: flex;
      justify-content: space-between;
    }

    #workspace {
      flex: 1;
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    #editor {
      width: 70%;
      min-width: 100px;
      height: 100%;
      border-right: 1px solid #ccc;
    }

    #resizer {
      width: 5px;
      background: #ccc;
      cursor: col-resize;
    }

    #console {
      width: 30%;
      min-width: 100px;
      height: 100%;
      background: #111;
      color: #0f0;
      padding: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    #left-controls, #right-controls {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 6px 10px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 8px;
      font-size: 0.85em;
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div id="left-controls"><strong>JS Code Compiler</strong></div>
    <div id="right-controls">
      <button id="runBtn">▶️ Run</button>
      <button id="clearBtn">🧹 Clear</button>
      <button id="shareBtn">📤 Share</button>
    </div>
  </div>

  <div id="workspace">
    <div id="editor"></div>
    <div id="resizer"></div>
    <div id="console"></div>
  </div>

  <!-- Monaco Editor -->
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const runBtn = document.getElementById('runBtn');
      const clearBtn = document.getElementById('clearBtn');
      const shareBtn = document.getElementById('shareBtn');
      const consoleDiv = document.getElementById('console');

      let editor;

      function decodeBase64Unicode(base64) {
        try {
          return decodeURIComponent(atob(base64));
        } catch (e) {
          console.warn('Invalid code in URL');
          return `console.log('Hello world');`;
        }
      }

      const params = new URLSearchParams(window.location.search);
      let initialCode = `console.log('Hello world');`;
      if (params.has('code')) {
        initialCode = decodeBase64Unicode(params.get('code'));
      }

      require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });

      require(['vs/editor/editor.main'], function () {
        editor = monaco.editor.create(document.getElementById('editor'), {
          value: initialCode,
          language: 'javascript',
          theme: 'vs-dark',
          automaticLayout: true,
        });

        runBtn.addEventListener('click', () => runCode());
        clearBtn.addEventListener('click', () => consoleDiv.innerHTML = '');
        shareBtn.addEventListener('click', () => {
          const code = editor.getValue();
          const encoded = btoa(encodeURIComponent(code));
          const url = `${location.origin}${location.pathname}?code=${encoded}`;
          navigator.clipboard.writeText(url).then(() => {
            alert('🔗 Shareable link copied to clipboard!');
          });
        });
      });

      function runCode() {
        const code = editor.getValue();
        consoleDiv.innerHTML = '';

        const encoded = btoa(encodeURIComponent(code));
        const newUrl = `${location.origin}${location.pathname}?code=${encoded}`;
        history.replaceState(null, '', newUrl);

        const originalLog = console.log;
        console.log = function (...args) {
          const line = args.map(arg => {
            if (typeof arg === 'object' && arg !== null) {
              try {
                if (Array.isArray(arg)) return JSON.stringify(arg);
                return JSON.stringify(arg, null, 2);
              } catch {
                return '[Circular]';
              }
            }
            return String(arg);
          }).join(' ');

          consoleDiv.innerHTML += line + '\n';
          consoleDiv.scrollTop = consoleDiv.scrollHeight;
          originalLog.apply(console, args);
        };

        try {
          new Function(code)();
        } catch (err) {
          consoleDiv.innerHTML += '⚠️ Error: ' + err.message + '\n';
        }

        console.log = originalLog;
      }

      // 🔁 Resize logic
      const resizer = document.getElementById('resizer');
      const editorPane = document.getElementById('editor');
      const consolePane = document.getElementById('console');

      let isResizing = false;

      resizer.addEventListener('mousedown', function () {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
      });

      document.addEventListener('mousemove', function (e) {
        if (!isResizing) return;

        const totalWidth = editorPane.parentNode.offsetWidth;
        const newEditorWidth = e.clientX;

        const min = 100;
        const max = totalWidth - 100;

        if (newEditorWidth > min && newEditorWidth < max) {
          editorPane.style.width = newEditorWidth + 'px';
          consolePane.style.width = (totalWidth - newEditorWidth - 5) + 'px';
        }
      });

      document.addEventListener('mouseup', function () {
        isResizing = false;
        document.body.style.cursor = 'default';
      });

      // 🧠 Visibility detection
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          consoleDiv.innerHTML += '[!] User switched tab or minimized window\n';
        }
      });

      window.addEventListener('blur', () => {
        consoleDiv.innerHTML += '[!] User lost window focus\n';
      });
    });
  </script>

  <footer>
    Author: Kevin Matamoros
  </footer>
</body>
</html>
